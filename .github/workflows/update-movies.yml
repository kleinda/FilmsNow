name: Update Movies Data

on:
  schedule:
    - cron: '0 4 * * 2'  # Every Tuesday at 04:00 UTC (07:00 Israel time)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate fresh movies.json
        run: node generate.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json meta.json
          git diff --cached --quiet || git commit -m "chore: update movies data [$(date +'%d/%m/%Y')]"
          git push
